{% extends 'base/base.html' %}

{% block title %}Password Changed{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 4rem auto; text-align: center;">
    <div class="glass-card animate-fade-in">
        <i class="fas fa-check-circle fa-4x" style="color: #4CAF50; margin-bottom: 1.5rem;"></i>
        <h2 style="color: var(--primary-color);">Password Updated!</h2>
        <p style="color: #666; margin-bottom: 2rem;">Your password has been changed successfully.</p>
        <a href="{% url 'home' %}" class="btn-primary">Back to Home</a>
    </div>
</div>
{% endblock %}
