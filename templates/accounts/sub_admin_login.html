{% extends 'base/base.html' %}

{% block title %}Sub-Admin Login | Kantha27{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto; text-align: center;">
    <div class="glass-card">
        <h2 style="color: var(--primary-color); margin-bottom: 2rem;">Sub-Admin Portal</h2>
        <p style="margin-bottom: 2rem; color: #666;">Secure Access for Administrative Staff</p>

        <form method="post">
            {% csrf_token %}

            {% if form.errors %}
            <div style="color: red; margin-bottom: 1rem; font-size: 0.9rem;">
                {{ form.non_field_errors }}
            </div>
            {% endif %}

            <div class="form-field-wrapper">
                <input type="text" name="username" placeholder="Username" required>
            </div>

            <div class="form-field-wrapper">
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">
                <i class="fas fa-lock"></i> Secure Login
            </button>
        </form>
    </div>
</div>
{% endblock %}
