{% extends 'base/base.html' %}

{% block title %}Delete Announcement | Kantha27{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="fas fa-trash-alt"></i> Delete Announcement</h1>
</div>

<div style="max-width: 500px; margin: 0 auto;">
    <div class="glass-card" style="padding: 2rem; text-align: center;">
        <p style="font-size: 1.1rem; color: var(--text-color); margin-bottom: 2rem;">
            Are you sure you want to delete this announcement?
            <br>
            <strong style="display: block; margin-top: 1rem; color: var(--primary-text-dark);">"{{
                news_item.message|truncatechars:50 }}"</strong>
        </p>

        <form method="post">
            {% csrf_token %}
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <button type="submit" class="btn-danger"
                    style="padding: 0.8rem 2rem; border-radius: 50px; border: none; font-weight: 600; cursor: pointer;">Yes,
                    Delete</button>
                <a href="{% url 'news_list' %}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
