{% extends 'base/base.html' %}

{% block title %}Delete {{ person.full_name }}{% endblock %}

{% block content %}
<div
    style="max-width: 600px; margin: 0 auto; background: white; padding: 2.5rem; border-radius: 20px; box-shadow: var(--shadow-lg); text-align: center;">
    <i class="fas fa-exclamation-triangle" style="font-size: 4rem; color: #f44336; margin-bottom: 1.5rem;"></i>
    <h2 class="text-secondary" style="font-weight: 800; margin-bottom: 1rem;">Are you sure?</h2>
    <p class="text-muted" style="font-size: 1.1rem; margin-bottom: 2rem;">
        Do you really want to delete <strong>{{ person.full_name }}</strong> from the directory? This action cannot be
        undone.
    </p>

    <form method="POST">
        {% csrf_token %}
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <button type="submit" class="btn-primary" style="background-color: #f44336; border-color: #f44336;">Yes,
                Delete</button>
            <a href="{% url 'people_directory' %}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
