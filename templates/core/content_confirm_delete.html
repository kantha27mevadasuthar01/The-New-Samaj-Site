{% extends 'base/base.html' %}

{% block title %}Delete Content | Kantha27{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto; text-align: center; padding-top: 3rem;">
    <div class="glass-card" style="padding: 3rem;">
        <i class="fas fa-exclamation-triangle" style="font-size: 4rem; color: #FFA000; margin-bottom: 2rem;"></i>
        <h2 style="color: #d32f2f; margin-bottom: 1rem;">Confirm Deletion</h2>
        <p style="color: #666; margin-bottom: 2rem;">
            Are you sure you want to delete <strong>{{ info_item.title }}</strong>?<br>
            This action cannot be undone.
        </p>

        <form method="post">
            {% csrf_token %}
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <button type="submit" class="btn-primary" style="background: #d32f2f; padding: 10px 30px;">Yes,
                    Delete</button>
                <a href="{% url 'manage_content' %}" class="btn-secondary"
                    style="padding: 10px 30px; background: #eee; color: #333;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
