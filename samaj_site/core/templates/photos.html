{% extends 'base.html' %}
{% block content %}
<h2>Photos</h2>
{% for post in posts %}
    <h3>{{ post.title }}</h3>
    <img src="{{ post.file.url }}" width="300">
    <p>{{ post.content }}</p>
{% endfor %}
{% endblock %}

{% if user.is_authenticated and user.is_staff %}
    <a href="{% url 'edit_post' post.id %}">Edit</a>
    <a href="{% url 'delete_post' post.id %}">Delete</a>
{% endif %}
